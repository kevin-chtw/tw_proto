syntax = "proto3";

package sproto;
option go_package = "../sproto";

// Admin remotes (matchcfg/signcfg/bonuscfg/decocfg/itemcfg/diyreport) messages.

// MatchCfg service (admin.matchcfg.*) messages.
message MatchCfgVersionReq {
  string server_type = 1; // island/fdtable/schedule/wheel, empty means all
}

message MatchCfgVersionAck {
  uint64 version = 1; // max(version) within scope
}

message MatchCfgRow {
  string server_type = 1;
  int32 match_id = 2;
  string name = 3;
  string content = 4; // YAML
  uint64 version = 5;
  string game_type = 6;
  string placement_ips = 7; // JSON array string, e.g. ["10.0.1.3","10.0.1.4"]
}

message MatchCfgListReq {
  string server_type = 1; // required
}

message MatchCfgListAck {
  repeated MatchCfgRow rows = 1;
}

message MatchCfgGetReq {
  string server_type = 1;
  int32 match_id = 2;
}

message MatchCfgGetAck {
  MatchCfgRow row = 1;
}

// SignCfg service (admin.signcfg.*) messages.
message SignCfgVersionReq {
  uint64 dummy = 1;
}

message SignCfgVersionAck {
  uint64 version = 1; // max(id) across sign_cfg / history / sign_bind
}

message SignCfgRow {
  int32 sign_id = 1;
  string content = 2; // YAML
  uint64 version = 3;
}

message SignCfgListReq {
  uint64 dummy = 1;
}

message SignCfgListAck {
  repeated SignCfgRow rows = 1;
}

message SignCfgGetReq {
  int32 sign_id = 1;
}

message SignCfgGetAck {
  SignCfgRow row = 1;
}

// SignBind service (admin.signbind.*) — match_id → sign_id
message SignBindVersionReq {
  uint64 dummy = 1;
}

message SignBindVersionAck {
  uint64 version = 1;
}

message SignBindRow {
  int32 match_id = 1;
  int32 sign_id = 2;
  string game_type = 3;
}

message SignBindListReq {
  string game_type = 1; // optional filter
}

message SignBindListAck {
  repeated SignBindRow rows = 1;
}

message SignBindGetReq {
  int32 match_id = 1;
}

message SignBindGetAck {
  SignBindRow row = 1;
}

// BonusCfg service (admin.bonuscfg.*) — 独立表 bonus_cfg*
message BonusCfgVersionReq {
  uint64 dummy = 1;
}

message BonusCfgVersionAck {
  uint64 version = 1;
}

message BonusCfgRow {
  int32 bonus_id = 1;
  string name = 2;
  string content = 3; // YAML
  uint64 version = 4;
}

message BonusCfgListReq {
  uint64 dummy = 1;
}

message BonusCfgListAck {
  repeated BonusCfgRow rows = 1;
}

message BonusCfgGetReq {
  int32 bonus_id = 1;
}

message BonusCfgGetAck {
  BonusCfgRow row = 1;
}

// BonusBind service (admin.bonusbind.*) — match_id → bonus_id
message BonusBindVersionReq {
  uint64 dummy = 1;
}

message BonusBindVersionAck {
  uint64 version = 1;
}

message BonusBindRow {
  int32 match_id = 1;
  int32 bonus_id = 2;
  string game_type = 3;
}

message BonusBindListReq {
  string game_type = 1;
}

message BonusBindListAck {
  repeated BonusBindRow rows = 1;
}

message BonusBindGetReq {
  int32 match_id = 1;
}

message BonusBindGetAck {
  BonusBindRow row = 1;
}

// DecoCfg service (admin.decocfg.*) messages.
message DecoCfgVersionReq {
  uint64 dummy = 1;
}

message DecoCfgVersionAck {
  uint64 version = 1;
}

message DecoCfgRow {
  int32 deco_id = 1;
  string name = 2;
  int32 category = 3;       // 1=头像框 2=麻将牌桌 3=麻将牌背 4=扑克牌桌 5=扑克牌背
  int32 status = 4;         // 0=禁用 1=启用
  bool is_default = 5;
  int32 sort = 6;
  string icon = 7;
  string preview_asset = 8;
  string acquire_desc = 9;
  string content = 10;      // 扩展 JSON（资源包、动画参数等）
  uint64 version = 11;
  string unlock = 12;       // 解锁条件 JSON（vip_level / vip_reward_claimed）
}

message DecoCfgListReq {
  uint64 dummy = 1;
}

message DecoCfgListAck {
  repeated DecoCfgRow rows = 1;
}

message DecoCfgGetReq {
  int32 deco_id = 1;
  int32 category = 2; // 1=头像框 2=麻将牌桌 3=麻将牌背 4=扑克牌桌 5=扑克牌背
}

message DecoCfgGetAck {
  DecoCfgRow row = 1;
}

// ItemCfg service (admin.itemcfg.*) messages.
message ItemCfgVersionReq {
  uint64 dummy = 1;
}

message ItemCfgVersionAck {
  uint64 version = 1;
}

message ItemDefRow {
  int32 item_id = 1;
  string name = 2;
  int32 category = 3; // 1=虚拟兑换券 2=实物兑换券 3=装扮试用券 4=装扮解锁券 5=礼包
  string icon = 4;
  string desc = 5;
  int32 sort = 6;
  bool stackable = 7;
  int32 max_stack = 8;
  bool enabled = 9;
  string meta = 10; // JSON
  uint64 version = 11;
}

message ItemCfgListReq {
  uint64 dummy = 1;
}

message ItemCfgListAck {
  repeated ItemDefRow rows = 1;
}

message ItemCfgGetReq {
  int32 item_id = 1;
}

message ItemCfgGetAck {
  ItemDefRow row = 1;
}

// DiyReport service (admin.diyreport.*) — diy → admin push.
message DiyPlayerInfo {
  string uid = 1;
  int64 score = 2;
  int32 rank = 3; // 0 = not ranked yet
  int64 signed_at_unix = 4;
}

message DiySignupReportReq {
  int32 match_id = 1;
  int64 tourney_id = 2;
  string uid = 3;
  int64 signed_at_unix = 4;
  string nickname = 5; // 报名时 diy 上报，admin 落库展示
}

message DiySignupReportAck {
  string err = 1;
}

message DiySignoutReportReq {
  int32 match_id = 1;
  int64 tourney_id = 2;
  string uid = 3;
}

message DiySignoutReportAck {
  string err = 1;
}

message DiyResultsReportReq {
  int32 match_id = 1;
  int64 tourney_id = 2;
  string status = 3;
  repeated DiyPlayerInfo results = 4;
}

message DiyResultsReportAck {
  string err = 1;
}

message DiyStatusReportReq {
  int32 match_id = 1;
  int64 tourney_id = 2;
  string status = 3;
}

message DiyStatusReportAck {
  string err = 1;
}

