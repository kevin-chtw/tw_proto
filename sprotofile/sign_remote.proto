syntax = "proto3";

package sproto;
option go_package = "../sproto";

message SignReq {
  string uid = 1;// 用户ID
  int32 matchid = 2; //比赛ID
  int32 cond_index = 3; //条件索引
  string channel = 4; // 登录渠道快照（握手原值）
}

message SignAck {
  int64 carry_max = 1; //报名时实际可携带分上限
  map<int32, int64> fee = 2;
}

message SignRefundReq {
  string uid = 1;
  int32 matchid = 2;
  string game_type = 3;
  map<int32, int64> fee = 4;
}

message SignRefundAck {}

// Admin 通知 sign 全量重载 cfg + bind
message SignReloadReq {}
message SignReloadAck {}

message SignDiyUpsertReq {
  int32 match_id = 1;
  string content = 2; // sign YAML
  int32 ttl_sec = 3;  // 0 = default 7d
}
message SignDiyUpsertAck {
  string err = 1;
}
message SignDiyDeleteReq {
  int32 match_id = 1;
}
message SignDiyDeleteAck {
  string err = 1;
}
