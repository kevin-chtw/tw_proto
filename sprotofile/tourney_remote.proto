syntax = "proto3";

import "google/protobuf/any.proto";

package sproto;
option go_package = "../sproto";

message TourneyReq {
  google.protobuf.Any req = 1;
}

message TourneyAck {
  google.protobuf.Any ack = 1;
}

message TourneyUpdateReq {
  repeated TourneyInfo infos = 1;
}

message TourneyInfo {
    int32 id = 1; //比赛ID（全局唯一）
    string serverid = 2; //服务器ID
    int32 online = 3; //在线人数
}

message FDTakeTableidReq {
  int32 matchid = 1; //比赛ID
  string serverid = 2; //服务器ID
  string game_type = 3; //游戏类型
}

message FDTakeTableidAck {
  int32 tableid = 1; //房间ID
}

message FDPutTableidReq {
  int32 tableid = 1; //房间ID
}

// Admin 通知 tourney 重载定点赛展示信息（format_desc / 开赛时间）
message TourneyReloadReq {}
message TourneyReloadAck {}

message SignupRegisterReq {
  string uid = 1;
  string server_type = 2;
  string server_id = 3;
  int32  match_id = 4;
  int64  tourney_id = 5;
  string game_type = 6;
  int64  next_start_ts = 7;
  map<int32, int64> fee = 8;
}

message SignupUnregisterReq {
  string uid = 1;
  string server_type = 2;
  int32  match_id = 3;
}

message SignupListReq {
  string server_type = 1;
  int32  match_id = 2;
}

message SignupListAck {
  repeated SignupRegisterReq entries = 1;
}

message SignupTouchReq {
  string uid = 1;
  string server_type = 2;
  string server_id = 3;
  int32  match_id = 4;
}

message SignupOwnerGetReq {
  string server_type = 1;
  int32 match_id = 2;
}

message SignupOwnerGetAck {
  string owner_id = 1;
  bool draining = 2;
}

message SignupOwnerClaimReq {
  string server_type = 1;
  int32 match_id = 2;
  string expected_owner_id = 3;
  string new_owner_id = 4;
}

message SignupOwnerClaimAck {
  bool claimed = 1;
  string owner_id = 2;
}

message SignupOwnerReleaseReq {
  string server_type = 1;
  int32 match_id = 2;
  string owner_id = 3;
}

message SignupOwnerReleaseAck {
  bool released = 1;
}

message SignupServerDrainReq {
  string server_id = 1;
}

message SignupServerDrainAck {}

message PairSignupReq {
  int32 match_id = 1;
  string owner_id = 2;
  oneof action {
    PairSignupInvite invite = 3;
    PairSignupConfirm confirm = 4;
    PairSignupCancel cancel = 5;
    PairSignupLock lock = 6;
    PairSignupPrepare prepare = 7;
    PairSignupCommit commit = 8;
    PairSignupAbort abort = 9;
  }
}

message PairSignupInvite {
  string invite_id = 1;
  PairSignupMember captain = 2;
  int32 max_players = 3;
}

message PairSignupConfirm {
  string invite_id = 1;
  PairSignupMember partner = 2;
}

message PairSignupCancel {
  string uid = 1;
}

message PairSignupLock {
  bool started = 1; // Actual execution has begun; permits normal snapshot expiry.
}

message PairSignupPrepare {
  string invite_id = 1;
  string attempt_id = 2;
  repeated PairSignupMember members = 3;
}

message PairSignupCommit {
  string invite_id = 1;
  string attempt_id = 2;
}

message PairSignupAbort {
  string invite_id = 1;
  string attempt_id = 2;
}

message PairSignupAck {
  PairSignupState state = 1;
  PairSignupTeam team = 2;
  string err = 3;
}

message PairSignupLoadReq {
  int32 match_id = 1;
  string owner_id = 2;
}

message PairSignupLoadAck {
  PairSignupState state = 1;
  string err = 2;
}

message PairSignupState {
  bool locked = 1;
  repeated PairSignupTeam teams = 2;
  int32 max_players = 3;
}

message PairSignupTeam {
  string team_id = 1;
  string invite_id = 2;
  string status = 3; // pending / billing / signed / refunding / cancelling / cancelled
  repeated PairSignupMember members = 4;
  string attempt_id = 5;
}

message PairSignupMember {
  SignupRegisterReq signup = 1;
  string nickname = 2;
  string avatar = 3;
  string channel = 4;
}
