syntax = "proto3";

import "google/protobuf/any.proto";

package sproto;
option go_package = "../sproto";

message TourneyReq {
  google.protobuf.Any req = 1;
}

message TourneyAck {
  google.protobuf.Any ack = 1;
}

message TourneyUpdateReq {
  repeated TourneyInfo infos = 1;
}

message TourneyInfo {
    int32 id = 1; //比赛ID
    string name = 2; //比赛名称
    string game_type = 3; //游戏类型
    string match_type = 4; //比赛类型
    string serverid = 5; //服务器ID
    int32 online = 6; //在线人数
    int64 score_base = 7;//基数
    string zone = 8; //赛区；空表示未配置
}

message FDTakeTableidReq {
  int32 matchid = 1; //比赛ID
  string serverid = 2; //服务器ID
  string game_type = 3; //游戏类型
}

message FDTakeTableidAck {
  int32 tableid = 1; //房间ID
}

message FDPutTableidReq {
  int32 tableid = 1; //房间ID
}

// Admin 通知 tourney 重载定点赛展示信息（format_desc / 开赛时间）
message TourneyReloadReq {}
message TourneyReloadAck {}

message SignupRegisterReq {
  string uid = 1;
  string server_type = 2;
  string server_id = 3;
  int32  match_id = 4;
  int64  tourney_id = 5;
  string game_type = 6;
  int64  next_start_ts = 7;
  map<int32, int64> fee = 8;
}

message SignupUnregisterReq {
  string uid = 1;
  string server_type = 2;
  int32  match_id = 3;
}

message SignupListReq {
  string server_type = 1;
  int32  match_id = 2;
}

message SignupListAck {
  repeated SignupRegisterReq entries = 1;
}

message SignupTouchReq {
  string uid = 1;
  string server_type = 2;
  string server_id = 3;
  int32  match_id = 4;
}