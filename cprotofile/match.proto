syntax = "proto3";

import "google/protobuf/any.proto";

package cproto;
option go_package = "../cproto";

message MatchReq {
  string serverid = 1;
  int32 matchid = 2; // 比赛ID
  google.protobuf.Any req = 3;
}

message MatchAck {
  string serverid = 1;
  int32 matchid = 2; // 比赛ID
  google.protobuf.Any ack = 3;
}

message CreateRoomReq {
  int32 game_count = 1; // 局数
  string desn = 2; //配置描述
  int32 pay_type = 3; //付费类型 // 0:队长支付，1：AA支付
  map<string, int32> properties = 4; // 配置信息 
  map<string, int32> match_config = 5; // 比赛配置信息 如人数，自动坐下，自动准备等
}

message CancelRoomReq {
  int32 tableid = 1;
}

message JoinRoomReq {
  int32 tableid = 1; // 桌号
}

message SignupReq {//报名
}

message SignoutReq {//取消报名
}

message ContinueReq {
  bool confirm = 1; // 确认从背包补充金币
}

message ExitMatchReq{  
}

message FDResultReq {
}

message CancelRoomAck {
  int32 tableid = 1;
}

message StartClientAck {
  string match_type = 1; //比赛类型
  string game_type = 2; //游戏类型
  string server_id = 3; //游戏服务Id
  int32 match_id = 4; //比赛ID
  int32 table_id = 5; //桌号
  int64 score_base = 6; //基数
  int64 tax = 7; // 服务费
}

message SignupAck {
}

message SignupRemindAck {
  int32 remain_sec = 1; // 300 / 180 / 60
}

message SignoutAck {
  int32 reason = 1; // 1 自己退 2 错过开赛 3 比赛取消
}

message ContinueAck {  
}

message RestAck {  
}

message ExitMatchAck { //弹回大厅
}

// 比赛结果上报
message FDResultAck {
  int32 tableid = 1;
  int32 game_count = 2; // 总局数
  string owner_id = 3; // 房主ID
  string desn = 4; //配置描述
  map<string,int64> scores = 5; // 各玩家得分
  map<string,string> player_data = 6; // 比赛数据 （json）
  repeated string rounds = 7; // 各局数据 （json）
}

// 每局比赛结果上报
message FDRoundResultAck {
  int32 cur_game_count = 1; // 当前局数
  map<string,int64> scores = 5; // 各玩家得分
  map<string,string> player_data = 6; // 比赛数据 （json）
  string round_data = 4; // 当局数据 （json）
}

message StageResultAck {
  int32 result = 1; // 0-游戏中，1-晋级，2-待定，3-淘汰，4-轮空，5-完赛
  int32 rank = 2; //当前名次
  int32 remain_tables = 3; // 当前阶段还在打的桌数
  int32 win_count = 4; // 整场胜次数
  int32 lose_count = 5; // 整场负次数
  string format = 6; // knockout / swiss / fix_score
  int32 round = 7; // 瑞士当前轮 / 定局当前局；打立为 0
  repeated int32 promote_counts = 8; // 打立: [晋级人数]; 瑞士: 各轮晋级人数; 定局: 空
  int32 stage_id = 9; // 当前阶段，从 1
  int32 stage_count = 10; // 配置 stages 条数
  int32 round_total = 11; // 瑞士规划轮数 / 定局总局数；打立为 0
}

message StageOverAck {
  int32 rank = 1;
  int64 score = 2;
  map<int32,int64> bonus = 3; // 本阶段结束排名奖
}

message RankListReq {
}

message RankListItem {
  int32 rank = 1;
  string uid = 2;
  string nickname = 3;
  int64 score = 4; // 游戏分
  int32 result = 5; // 0-游戏中，1-晋级，2-待定，3-淘汰，4-轮空，5-完赛
}

message RankListAck {
  repeated RankListItem players = 1; // 当前阶段全量，按 rank 升序
  RankListItem self = 2; // 请求者一行；不在榜上则 uid 为空
}

message BonusRewardAck {
  string bonus_type = 1; //奖金类型
  int32 cond = 2; //奖金条件索引
  map<int32,int64> bonus = 3; //奖金详情
  int32 next_cond = 4; //下一奖励条件
  map<int32,int64> next_bonus = 5; //下一级奖金详情
}