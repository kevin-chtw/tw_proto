syntax = "proto3";

import "google/protobuf/any.proto";

package cproto;
option go_package = "../cproto";

message MatchReq {
  string serverid = 1;
  int32 matchid = 2; // 比赛ID
  google.protobuf.Any req = 3;
}

message MatchAck {
  string serverid = 1;
  int32 matchid = 2; // 比赛ID
  google.protobuf.Any ack = 3;
}

message CreateRoomReq {
  int32 game_count = 1; // 局数
  string desn = 2; //配置描述
  int32 pay_type = 3; //付费类型 // 0:队长支付，1：AA支付
  map<string, int32> properties = 4; // 配置信息 
  map<string, int32> match_config = 5; // 比赛配置信息 如人数，自动坐下，自动准备等
}

message CancelRoomReq {
  int32 tableid = 1;
}

message JoinRoomReq {
  int32 tableid = 1; // 桌号
}

message SignupReq {//报名
}

message SignoutReq {//取消报名
}

message ContinueReq {
  bool confirm = 1; // 确认从背包补充金币
}

message ExitMatchReq{  
}

message FDResultReq {
}

message CancelRoomAck {
  int32 tableid = 1;
}

// 跳台一条：该轮赛制 + 本台开打人数。打立、定局整阶段各 1 条；瑞士每轮 1 条。
// 上一阶段晋级人数是下一阶段第一台的 count，不要再标成上一阶段。
message TourneyRound {
  string format = 1; // knockout / swiss / fix_score
  int32 count = 2; // 本台开打人数（打立第一台=整场人数）
  int32 games = 3; // 定局: YAML games；瑞士: games_per_round，缺省 1；打立: 1
}

// 锦标赛进度。入桌/重连在 StartClientAck.stage_info，本桌结束在 StageResultAck.stage_info。
// 前端接法：
//   跳台列表 = rounds（按下标 0..n-1 画）
//   当前台 = rounds[round]（round 从 0，不要当「第几阶段」）
//   当前赛制/局数 = rounds[round].format / .games
//   规划人数 = rounds[round].count；现场还在场人数 = player_count
//   文案「第 N 轮」= round+1；「共 N 轮」= len(rounds)
//   待定/晋级/淘汰 = result；剩余桌数 = remain_tables；胜负场 = win_count/lose_count
//   重连休息界面只看 StartClientAck.stage_info 即可，不必等 StageResultAck
//   跨台：确认晋级后 result=1，延迟后再 StartClientAck 进开赛区
//   非锦标赛 stage_info 为空
message StageInfo {
  int32 rank = 1; // 当前名次
  int32 player_count = 2; // 当前还在场人数（现场值，不是规划人数）
  int32 round = 3; // 当前跳台下标，从 0；取 rounds[round]
  repeated TourneyRound rounds = 4;
  string group = 5; // 分组 A/B/C；未分组为空
  int32 result = 6; // 0游戏中 1晋级 2待定 3淘汰 4轮空 5完赛 6组桌中
  int32 remain_tables = 7; // 当前阶段还在打的桌数
  int32 win_count = 8; // 整场胜次数
  int32 lose_count = 9; // 整场负次数
}

message StartClientAck {
  string match_type = 1; //比赛类型
  string game_type = 2; //游戏类型
  string server_id = 3; //游戏服务Id
  int32 match_id = 4; //比赛ID
  int32 table_id = 5; //桌号
  int64 score_base = 6; //基数
  int64 tax = 7; // 服务费
  StageInfo stage_info = 8; // 锦标赛进度，见 StageInfo 注释；非锦标赛为空
}

message SignupAck {
}

message SignupRemindAck {
  int32 remain_sec = 1; // 300 / 180 / 60
}

message SignoutAck {
  int32 reason = 1; // 1 自己退 2 错过开赛 3 比赛取消
}

message ContinueAck {  
}

message RestAck {  
}

message ExitMatchAck { //弹回大厅
}

message MatchBanruptAck { //真破产，触发弹窗
}

// 比赛结果上报
message FDResultAck {
  int32 tableid = 1;
  int32 game_count = 2; // 总局数
  string owner_id = 3; // 房主ID
  string desn = 4; //配置描述
  map<string,int64> scores = 5; // 各玩家得分
  map<string,string> player_data = 6; // 比赛数据 （json）
  repeated string rounds = 7; // 各局数据 （json）
}

// 每局比赛结果上报
message FDRoundResultAck {
  int32 cur_game_count = 1; // 当前局数
  map<string,int64> scores = 5; // 各玩家得分
  map<string,string> player_data = 6; // 比赛数据 （json）
  string round_data = 4; // 当局数据 （json）
}

message StageResultAck {
  StageInfo stage_info = 5; // 同 StartClientAck.stage_info
}

message StageOverAck {
  int32 rank = 1;
  int64 score = 2;
  map<int32,int64> bonus = 3; // 本阶段结束排名奖
}

// 打立达到截断人数，停止组桌
message KnockoutCutoffAck {
  int32 cutoff_count = 1; // 截断人数
  int32 player_count = 2; // 当前存活人数
  int32 remain_tables = 3; // 还在打的桌数
  int32 stage_id = 4;
}

message RankListReq {
}

message RankListItem {
  int32 rank = 1;
  string uid = 2;
  string nickname = 3;
  int64 score = 4; // 游戏分
  int32 result = 5; // 0-游戏中，1-晋级，2-待定，3-淘汰，4-轮空，5-完赛，6-组桌中
}

message RankListAck {
  repeated RankListItem players = 1; // 当前阶段全量，按 rank 升序
  RankListItem self = 2; // 请求者一行；不在榜上则 uid 为空
}

message BonusRewardAck {
  string bonus_type = 1; //奖金类型
  int32 cond = 2; //奖金条件索引
  map<int32,int64> bonus = 3; //奖金详情
  int32 next_cond = 4; //下一奖励条件
  map<int32,int64> next_bonus = 5; //下一级奖金详情
}